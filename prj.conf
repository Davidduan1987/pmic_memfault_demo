CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C_SHELL=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y

# Bluetooth LE - mem_lbs (LED Button Service), open access, no pairing
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="mem_lbs"
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

# Bluetooth LE - Memfault Diagnostic Service (chunks forwarded by a BLE gateway)
CONFIG_BT_MDS=y

# BLE throughput tuning for faster Memfault chunk transfer
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memfault
# Event storage is snapshotted to flash every 5 minutes (src/memfault_persist.c) so
# heartbeats/trace events collected while BLE is disconnected survive a reboot or
# power loss. Sized as 2 x 3072-byte NVS entries (see MFLT_STORAGE_PART_COUNT).
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=6144
CONFIG_MEMFAULT=y

# Official Memfault "Core Metrics: Battery" integration for the nPM13xx fuel gauge.
# Auto-selects CONFIG_MEMFAULT_METRICS_BATTERY_ENABLE, which defines and populates
# battery_soc_pct, battery_soc_pct_drop and battery_discharge_duration_ms (required
# for the Memfault dashboard's Battery widget), plus battery_voltage and
# battery_soh_pct on NCS 3.4+.
CONFIG_MEMFAULT_NRF_PLATFORM_BATTERY_NPM13XX=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY="<YOUR_MEMFAULT_PROJECT_KEY>"
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="mem-lbs-nrf54l15"
CONFIG_MEMFAULT_NCS_BT_METRICS=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
CONFIG_MEMFAULT_SHELL=y

# Heap memory required by the Memfault shell/CLI
CONFIG_HEAP_MEM_POOL_SIZE=256
